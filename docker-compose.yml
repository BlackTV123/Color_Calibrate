version: '3.8'

# =====================================================================
# Production-like Docker Compose Deployment
# Bruise Color Calibration & Analysis Clinical System
# =====================================================================

services:
  # 1. Relational Database Service (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: bruise_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your private deployment environment}
      MYSQL_DATABASE: bruise_db
      MYSQL_USER: bruise_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in your private deployment environment}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      # Persistent named volume ensures patient records and auth data survive restarts
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root"]
      interval: 8s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bruise_network

  # 2. Unified Application Container (FastAPI + React Multi-stage Build)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bruise_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your private deployment environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your private deployment environment}
      AUTH_ENV: production
      AUTH_STATE_PATH: /auth-state/state.sqlite3
      PYTHONUNBUFFERED: 1
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - auth_state:/auth-state
    networks:
      - bruise_network

# Persistent data volumes
volumes:
  auth_state:
    driver: local
  mysql_data:
    driver: local

# Isolated container network
networks:
  bruise_network:
    driver: bridge
